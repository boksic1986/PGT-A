base_config: "/data/project/CNV/PGT-A/test_project/predict_samples.yaml"

pipeline:
  mode: "predict"
  targets:
    - "metadata"
    - "cnv_qc"
    - "cnv"
    - "cnv_eval"
    - "cnv_benchmark"
    - "cnv_report"

reference_assets:
  refmap_tsvs:
    - "/data/project/CNV/PGT-A/refactor_validation_20260419/reports/refmap_audit_20260616/low_refbin_bins.tsv"

core:
  project_path: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only"
  wisecondorx:
    reference_output_by_sex:
      XX: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/XX/result/ref_xx_best.npz"
      XY: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/XY/result/ref_xy_best.npz"
    gender_reference_output: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/gender/result/ref_gender_best.npz"
    common_reference_binsize_output: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/gender/common_best_binsize.txt"
    cnv:
      reference_id: "build_ref_v2_mask_only_100kb"
      preprocess:
        strategy: "mask_only"
      negative_bank:
        samples_tsv: "/data/project/CNV/PGT-A/refactor_validation_20260419/docs/reports/branch_ab_v2_negative_bank_seed_2026-06-18.tsv"
        version: "branch_ab_v2_seed_2026-06-18"
        feature_column: "corrected_amplitude"
        min_background: 5
        similar_length_fold: 2.0
      evaluation:
        truth_tsv: "/data/project/CNV/PGT-A/test_project/sample_info/positive_truth_events.tsv"
      benchmark:
        truth_tsv: "/data/project/CNV/PGT-A/test_project/sample_info/positive_truth_events.tsv"
        mosaic_fraction_truth_tsv: "/data/project/CNV/PGT-A/refactor_validation_20260419/sample_info/mosaic_fraction_validation_y7_y8.tsv"
      postprocess:
        calling:
          hmm_role: "sidecar"
        annotation:
          blacklist_bed: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_build_ref_v2_mask_only/reference/assets/mask/hard_mask.bed"
          gap_centromere_telomere_bed: "/data/project/CNV/PGT-A/refactor_validation_20260419/resources/hg19/gap_centromere_telomere.hg19.bed"
          segmental_duplication_bed: "/data/project/CNV/PGT-A/refactor_validation_20260419/resources/hg19/segmental_duplication.hg19.bed"
          low_mappability_bed: "/data/project/CNV/PGT-A/refactor_validation_20260419/resources/hg19/low_mappability_consensus_excludable.hg19.bed"
          repeat_rich_bed: "/data/project/CNV/PGT-A/refactor_validation_20260419/resources/hg19/repeat_rich_high_confidence.hg19.bed"
