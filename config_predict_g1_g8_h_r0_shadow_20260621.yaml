    cnv:
      reference_id: "h_r0_shadow_ref_20260619"
      preprocess:
        strategy: "mask_only"
      negative_bank:
        samples_tsv: "/data/project/CNV/PGT-A/refactor_validation_20260419/docs/reports/branch_ab_v2_negative_bank_seed_2026-06-18.tsv"
        version: "branch_ab_v2_h_r0_shadow_ref_20260619"
        feature_column: "corrected_amplitude"
        min_background: 5
        similar_length_fold: 2.0
        shadow_background_labels: ["N1"]
        background_ledgers:
          - "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_20260608_h_r0_shadow_ref_20260619/wisecondorx/cnv/postprocess/evidence_ledger/H9.candidate_evidence.tsv"
          - "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_20260608_h_r0_shadow_ref_20260619/wisecondorx/cnv/postprocess/evidence_ledger/H10.candidate_evidence.tsv"
          - "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_20260608_h_r0_shadow_ref_20260619/wisecondorx/cnv/postprocess/evidence_ledger/H11.candidate_evidence.tsv"
          - "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_20260608_h_r0_shadow_ref_20260619/wisecondorx/cnv/postprocess/evidence_ledger/H12.candidate_evidence.tsv"
          - "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_20260608_h_r0_shadow_ref_20260619/wisecondorx/cnv/postprocess/evidence_ledger/H15.candidate_evidence.tsv"
          - "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_20260608_h_r0_shadow_ref_20260619/wisecondorx/cnv/postprocess/evidence_ledger/H16.candidate_evidence.tsv"
      evaluation:
        truth_tsv: "/data/project/CNV/PGT-A/refactor_validation_20260419/sample_info/g1_g8_truth_events_20260621.tsv"
      benchmark:
        truth_tsv: "/data/project/CNV/PGT-A/refactor_validation_20260419/sample_info/g1_g8_truth_events_20260621.tsv"
      postprocess:
        calling:
          hmm_role: "sidecar"
        annotation:
          blacklist_bed: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_r0_shadow_ref_20260619/reference/assets/mask/hard_mask.bed"
          gap_centromere_telomere_bed: "/data/project/CNV/PGT-A/refactor_validation_20260419/resources/hg19/gap_centromere_telomere.hg19.bed"
          segmental_duplication_bed: "/data/project/CNV/PGT-A/refactor_validation_20260419/resources/hg19/segmental_duplication.hg19.bed"
          low_mappability_bed: "/data/project/CNV/PGT-A/refactor_validation_20260419/resources/hg19/low_mappability_consensus_excludable.hg19.bed"
          repeat_rich_bed: "/data/project/CNV/PGT-A/refactor_validation_20260419/resources/hg19/repeat_rich_high_confidence.hg19.bed"

