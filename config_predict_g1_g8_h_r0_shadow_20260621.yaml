base_config: "build_samples.yaml"

pipeline:
  mode: "predict"
  targets:
    - "metadata"
    - "cnv_qc"
    - "cnv"
    - "cnv_eval"
    - "cnv_benchmark"
    - "cnv_report"

reference_assets:
  refmap_tsvs:
    - "/data/project/CNV/PGT-A/refactor_validation_20260419/reports/refmap_audit_20260616/low_refbin_bins.tsv"

core:
  project_path: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_g1_g8_h_r0_shadow_ref_20260621"
  wisecondorx:
    reference_model_root: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_r0_shadow_ref_20260619/reference"
    reference_output_by_sex:
      XX: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_r0_shadow_ref_20260619/reference/XX/result/ref_xx_best.npz"
      XY: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_r0_shadow_ref_20260619/reference/XY/result/ref_xy_best.npz"
    gender_reference_output: "/data/project/CNV/PGT-A/refactor_validation_20260419/results_h_r0_shadow_ref_20260619/reference/gender/result/ref_gender_best.npz"
